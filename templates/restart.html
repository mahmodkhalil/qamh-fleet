{% extends "base.html" %}

{% block title %}إعادة التشغيل{% endblock %}

{% block content %}

<div class="card" style="max-width: 600px; margin: 50px auto; text-align: center;">
    <div style="font-size: 60px; margin-bottom: 20px;">🔄</div>
    <h2 style="border: none;">جاري إعادة تشغيل التطبيق...</h2>
    <p style="color: #718096; margin: 20px 0;">الرجاء الانتظار 5-10 ثواني، ثم سجّل الدخول من جديد.</p>
    
    <div style="margin: 30px 0;">
        <div style="display: inline-block; width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: #1e3a5f; border-radius: 50%; animation: spin 1s linear infinite;"></div>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

<script>

    }).catch(function() {});

{% endblock %}
